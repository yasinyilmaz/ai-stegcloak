<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Filigran tarama arayüzü</title>
  <desc id="desc">Parçalanmış AI metnindeki görünmez filigranın doğrulanma ekranı</desc>
  <defs><radialGradient id="detectGlow" cx="84%" cy="0" r="90%"><stop stop-color="#62f5e2" stop-opacity=".16"/><stop offset=".55" stop-color="#a782ff" stop-opacity=".08"/><stop offset="1" stop-color="#070711" stop-opacity="0"/></radialGradient></defs>
  <rect width="760" height="520" rx="24" fill="#070711"/>
  <rect width="760" height="520" rx="24" fill="url(#detectGlow)"/>
  <rect x="24" y="24" width="712" height="472" rx="20" fill="#111121" fill-opacity=".92" stroke="#365e61"/>
  <rect x="48" y="48" width="38" height="38" rx="11" fill="#62f5e2" fill-opacity=".09" stroke="#3f817a"/>
  <text x="67" y="72" text-anchor="middle" fill="#62f5e2" font-family="monospace" font-size="12" font-weight="700">02</text>
  <text x="102" y="54" fill="#62f5e2" font-family="monospace" font-size="8" font-weight="700" letter-spacing="1.5">THE REVEAL</text>
  <text x="102" y="75" fill="#f7f4ff" font-family="system-ui,sans-serif" font-size="21" font-weight="750">Görünmeyeni açığa çıkarın</text>
  <text x="102" y="92" fill="#aaa5c0" font-family="system-ui,sans-serif" font-size="12">Tam metni veya yalnızca bir bölümünü yapıştır</text>

  <text x="48" y="124" fill="#c5bfd4" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">İNCELENECEK METİN</text>
  <rect x="48" y="136" width="664" height="188" rx="10" fill="#080812" stroke="#34484b"/>
  <g fill="#e8e3f2" font-family="system-ui,sans-serif" font-size="12">
    <text x="62" y="164">...deneysel yaklaşım, her kelimenin sonuna yalnızca üç görünmez</text>
    <text x="62" y="185">karakter yerleştirerek doğrulanabilir ve dağıtık bir provenance sinyali</text>
    <text x="62" y="206">oluşturuyor. Metnin bir bölümü silinse veya yalnızca tek bir paragraf</text>
    <text x="62" y="227">kopyalansa bile yeterli sembol hayatta kaldığında doğrulama yapılabiliyor.</text>
  </g>
  <text x="48" y="350" fill="#aaa5c0" font-family="monospace" font-size="10">60 görünmez karakter</text>
  <rect x="542" y="334" width="170" height="38" rx="10" fill="#62f5e2"/>
  <text x="627" y="358" text-anchor="middle" fill="#071713" font-family="system-ui,sans-serif" font-size="12" font-weight="800">⌁ Taramayı başlat</text>

  <rect x="48" y="396" width="664" height="76" rx="12" fill="#102224" stroke="#3f817a"/>
  <circle cx="74" cy="423" r="13" fill="#17383a"/>
  <text x="74" y="428" text-anchor="middle" fill="#62f5e2" font-family="system-ui,sans-serif" font-size="15">✓</text>
  <text x="98" y="421" fill="#f7f4ff" font-family="system-ui,sans-serif" font-size="13" font-weight="750">AI provenance doğrulandı</text>
  <text x="98" y="440" fill="#aaa5c0" font-family="system-ui,sans-serif" font-size="10">demo-ai-provider sağlayıcısına ait dağıtık filigran bulundu.</text>
  <g fill="#c1b9d2" font-family="monospace" font-size="9">
    <text x="98" y="460">20 sembol</text>
    <text x="190" y="460">20 en uzun dizi</text>
    <text x="326" y="460">%100 pencere</text>
    <text x="448" y="460">%100 içerik uyumu</text>
  </g>
</svg>
