  <text x="102" y="92" fill="#aaa5c0" font-family="system-ui,sans-serif" font-size="12">Sağlayıcı frontend entegrasyonunun simülasyonu</text>

  <text x="48" y="124" fill="#c5bfd4" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">SAĞLAYICI KİMLİĞİ</text>
  <rect x="48" y="136" width="664" height="42" rx="10" fill="#080812" stroke="#3b3451"/>
  <text x="62" y="162" fill="#f0ecf9" font-family="system-ui,sans-serif" font-size="13">demo-ai-provider</text>

  <text x="48" y="208" fill="#c5bfd4" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">AI TARAFINDAN ÜRETİLEN METİN</text>
  <rect x="48" y="220" width="664" height="110" rx="10" fill="#080812" stroke="#3b3451"/>
  <g fill="#e8e3f2" font-family="system-ui,sans-serif" font-size="12">
    <text x="62" y="245">Yapay zeka sistemleri tarafından üretilen metinlerin kaynağını anlamak</text>
    <text x="62" y="266">giderek daha önemli hale geliyor. Bu yaklaşım her kelimenin sonuna</text>
    <text x="62" y="287">yalnızca üç görünmez karakter yerleştirerek dağıtık bir sinyal oluşturuyor.</text>
  </g>
  <text x="48" y="354" fill="#aaa5c0" font-family="monospace" font-size="10">52 kelime</text>
  <rect x="548" y="338" width="164" height="38" rx="10" fill="#a782ff"/>
  <text x="630" y="362" text-anchor="middle" fill="#100b19" font-family="system-ui,sans-serif" font-size="12" font-weight="800">✦ Filigran oluştur</text>

  <line x1="48" y1="396" x2="712" y2="396" stroke="#34304b"/>
  <circle cx="53" cy="421" r="4" fill="#62f5e2"/>
  <text x="65" y="425" fill="#f0ecf9" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Filigran yerleştirildi</text>
  <text x="660" y="425" fill="#c9b4ff" font-family="system-ui,sans-serif" font-size="11">Kopyala</text>

