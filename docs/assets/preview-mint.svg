<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Filigran oluşturma arayüzü</title>
  <desc id="desc">AI metnine görünmez filigran ekleme ekranının ön izlemesi</desc>
  <defs><radialGradient id="mintGlow" cx="20%" cy="0" r="90%"><stop stop-color="#a782ff" stop-opacity=".22"/><stop offset="1" stop-color="#070711" stop-opacity="0"/></radialGradient></defs>
  <rect width="760" height="520" rx="24" fill="#070711"/>
  <rect width="760" height="520" rx="24" fill="url(#mintGlow)"/>
  <rect x="24" y="24" width="712" height="472" rx="20" fill="#111121" fill-opacity=".92" stroke="#4d416e"/>
  <rect x="48" y="48" width="38" height="38" rx="11" fill="#a782ff" fill-opacity=".13" stroke="#9273da"/>
  <text x="67" y="72" text-anchor="middle" fill="#c9b4ff" font-family="monospace" font-size="12" font-weight="700">01</text>
  <text x="102" y="54" fill="#c9b4ff" font-family="monospace" font-size="8" font-weight="700" letter-spacing="1.5">THE ENCHANTMENT</text>
